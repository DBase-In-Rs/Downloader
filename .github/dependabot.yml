version: 2
updates:
  # Dart/Flutter packages (pubspec.yaml).
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dart-dependencies:
        patterns: ["*"]

  # Android Gradle dependencies (youtubedl-android, Jackson, AGP/Kotlin).
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
    groups:
      android-dependencies:
        patterns: ["*"]

  # GitHub Actions used by CI and release workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-dependencies:
        patterns: ["*"]
