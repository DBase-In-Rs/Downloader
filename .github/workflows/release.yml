name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build split APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-*-release.apk

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package tarball
        run: |
          version="${{ github.ref_name }}"
          case "$version" in v*) ;; *) version="manual" ;; esac
          tar -C build/linux/x64/release/bundle -czf \
            "build/dbase-downloader-$version-linux-x64.tar.gz" .

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-tarball
          path: build/dbase-downloader-*-linux-x64.tar.gz

      - name: Attach tarball to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: build/dbase-downloader-*-linux-x64.tar.gz

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) { $version = "manual" }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "build\dbase-downloader-$version-windows-x64.zip" -Force

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-zip
          path: build/dbase-downloader-*-windows-x64.zip

      - name: Attach zip to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: build/dbase-downloader-*-windows-x64.zip
