name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          # 21 matches the F-Droid buildserver JDK; a different javac emits
          # slightly different dex and breaks reproducible-build verification.
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$RUNNER_TEMP/release.jks
          EOF

      - name: Analyze and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # The checked-in jniLibs are convenience copies for local builds; both
      # this job and the F-Droid recipe rebuild them from source with the
      # same NDK and flags so the two pipelines emit identical bytes.
      - name: Rebuild bundled libwebp from source
        run: |
          NDK_VERSION=28.2.13676358
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" > /dev/null
          git clone --depth=1 --branch v1.5.0 https://chromium.googlesource.com/webm/libwebp "$RUNNER_TEMP/libwebp"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cmake -S "$RUNNER_TEMP/libwebp" -B "$RUNNER_TEMP/libwebp-$abi" \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_HOME/ndk/$NDK_VERSION/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-24 -DBUILD_SHARED_LIBS=ON \
              -DWEBP_BUILD_ANIM_UTILS=OFF -DWEBP_BUILD_CWEBP=OFF -DWEBP_BUILD_DWEBP=OFF \
              -DWEBP_BUILD_GIF2WEBP=OFF -DWEBP_BUILD_IMG2WEBP=OFF -DWEBP_BUILD_VWEBP=OFF \
              -DWEBP_BUILD_WEBPINFO=OFF -DWEBP_BUILD_WEBPMUX=OFF -DWEBP_BUILD_EXTRAS=OFF > /dev/null
            cmake --build "$RUNNER_TEMP/libwebp-$abi" -j > /dev/null
            for lib in libsharpyuv libwebp libwebpdecoder libwebpdemux libwebpmux; do
              cp "$RUNNER_TEMP/libwebp-$abi/$lib.so" "android/app/src/main/jniLibs/$abi/$lib.so"
            done
          done

      - name: Build split APKs
        run: |
          flutter build apk --release --split-per-abi
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/

      # F-Droid verifies its from-source build against these signed variants
      # (Binaries/AllowedAPKSigningKeys in the fdroiddata recipe) and ships
      # our APK when they match, so users can move between the two channels.
      - name: Build F-Droid variant APKs
        run: |
          flutter build apk --release --split-per-abi --dart-define=FDROID_BUILD=true
          for abi in armeabi-v7a arm64-v8a x86_64; do
            cp "build/app/outputs/flutter-apk/app-$abi-release.apk" \
               "dist/app-$abi-fdroid-release.apk"
          done

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-apks
          retention-days: 5
          path: dist/app-*.apk

      - name: Attach APKs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/app-*.apk

  linux:
    name: Linux build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release

      - name: Package tarball and deb
        run: |
          version="${{ github.ref_name }}"
          case "$version" in v*) ;; *) version="vmanual" ;; esac
          tar -C build/linux/x64/release/bundle -czf \
            "build/dbase-downloader-$version-linux-x64.tar.gz" .
          bash tool/build_deb.sh "${version#v}"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-packages
          retention-days: 5
          path: |
            build/dbase-downloader-*-linux-x64.tar.gz
            build/dbase-downloader-*-linux-amd64.deb

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            build/dbase-downloader-*-linux-x64.tar.gz
            build/dbase-downloader-*-linux-amd64.deb

      - name: Publish deb to apt repo
        if: startsWith(github.ref, 'refs/tags/')
        env:
          PEACE_SSH_KEY: ${{ secrets.PEACE_SSH_KEY }}
          PEACE_SSH_HOST: ${{ secrets.PEACE_SSH_HOST }}
        run: |
          if [ -z "$PEACE_SSH_KEY" ] || [ -z "$PEACE_SSH_HOST" ]; then
            echo "apt repo secrets not configured; skipping"
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$PEACE_SSH_KEY" > ~/.ssh/peace_ci
          chmod 600 ~/.ssh/peace_ci
          ssh-keyscan -H "$PEACE_SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          cat build/dbase-downloader-*-linux-amd64.deb \
            | ssh -i ~/.ssh/peace_ci "peace@$PEACE_SSH_HOST"

  windows:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows

      - name: Package zip and installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version.StartsWith("v")) { $version = "vmanual" }
          Compress-Archive -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "build\dbase-downloader-$version-windows-x64.zip" -Force
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=$($version.TrimStart("v")) windows\installer\setup.iss

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-packages
          retention-days: 5
          path: |
            build/dbase-downloader-*-windows-x64.zip
            build/dbase-downloader-*-windows-x64-setup.exe

      - name: Attach packages to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
          files: |
            build/dbase-downloader-*-windows-x64.zip
            build/dbase-downloader-*-windows-x64-setup.exe
