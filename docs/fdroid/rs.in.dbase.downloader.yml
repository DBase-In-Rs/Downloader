AntiFeatures:
  NonFreeNet:
    en-US: The manual yt-dlp engine update in Settings downloads the latest yt-dlp
      release through the GitHub API.
Categories:
  - Multimedia
  - Internet
License: GPL-3.0-only
AuthorName: Velimir Majstorov
SourceCode: https://github.com/DBase-In-Rs/Downloader
IssueTracker: https://github.com/DBase-In-Rs/Downloader/issues
Changelog: https://github.com/DBase-In-Rs/Downloader/blob/HEAD/CHANGELOG.md
Donate: https://ko-fi.com/majstorov

AutoName: DBase Downloader

RepoType: git
Repo: https://github.com/DBase-In-Rs/Downloader.git

Builds:
  - versionName: 1.0.1
    versionCode: 1008
    commit: e6618ef6ad6f1529f600fd1e6947b78b5fb83514
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/flutter.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm"
        --dart-define=FDROID_BUILD=true

  - versionName: 1.0.1
    versionCode: 2008
    commit: e6618ef6ad6f1529f600fd1e6947b78b5fb83514
    output: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/flutter.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-arm64"
        --dart-define=FDROID_BUILD=true

  - versionName: 1.0.1
    versionCode: 4008
    commit: e6618ef6ad6f1529f600fd1e6947b78b5fb83514
    output: build/app/outputs/flutter-apk/app-x86_64-release.apk
    srclibs:
      - flutter@stable
    rm:
      - ios
      - linux
      - macos
      - windows
    prebuild:
      - flutterVersion=$(sed -n -E "s/.*flutter-version:\ '(.*)'/\1/p" .github/workflows/flutter.yml)
      - '[[ $flutterVersion ]]'
      - git -C $$flutter$$ checkout -f $flutterVersion
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform="android-x64"
        --dart-define=FDROID_BUILD=true

MaintainerNotes: |-
  Builds pass --dart-define=FDROID_BUILD=true, which compiles out the GitHub
  release check and the automatic yt-dlp update on app startup; the manual
  yt-dlp engine update in Settings remains and is covered by the NonFreeNet
  anti-feature. The Flutter version is read from the flutter-version pin in
  .github/workflows/flutter.yml. Version codes follow Flutter's
  --split-per-abi scheme: 1000*ABI + build number from pubspec.yaml
  (armeabi-v7a=1, arm64-v8a=2, x86_64=4).

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
VercodeOperation:
  - 1000+%c
  - 2000+%c
  - 4000+%c
UpdateCheckData: pubspec.yaml|version:\s.+\+(\d+)|.|version:\s(.+)\+
CurrentVersion: 1.0.1
CurrentVersionCode: 4008
